# Static analysis configuration.
# https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Reject implicit `dynamic` downcasts, unresolved type inference, and bare
    # generics. These turn a class of runtime TypeErrors into compile errors.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
  errors:
    # Deprecations should be visible without failing the build.
    deprecated_member_use: info

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_super_parameters
